<script>
(() => {
 const root=document.getElementById('thermal-keyboard-preview');
 function fitPrototype(){
  const scale=Math.max(.05,Math.min(1,(root.clientWidth-48)/360,(window.innerHeight-48)/783));
  root.style.setProperty('--prototype-scale',String(scale));
 }
 new ResizeObserver(fitPrototype).observe(root);
 window.addEventListener('resize',fitPrototype);
 fitPrototype();
 const keyboard=root.querySelector('.keyboard');
 const clouds=root.querySelector('canvas');
 const context=clouds.getContext('2d');
 const image=context?.createImageData(clouds.width,clouds.height);
 const background=root.querySelector('.keyboard-reference');
 const backgroundLayer=root.querySelector('.keyboard-background');
 let backgroundPixels=null;
 const editor=root.querySelector('.typing-input');
 const rows=root.querySelectorAll('[data-letters]');
 let uppercase=true,english=false,numbers=false;
 let inputRate=0,temperature=5,targetTemperature=5,lastThermal=performance.now(),repeatInput=false,composing=false,lastComposition=-Infinity;
 function updateThermal(now){
  const dt=Math.max(0,(now-lastThermal)/1000);lastThermal=now;
  inputRate*=Math.exp(-dt/2);
  const fraction=Math.pow(Math.max(0,Math.min(1,(inputRate-.2)/4)),.85);
  targetTemperature=5+40*fraction;
  const inertia=targetTemperature>temperature?.9:3.4;
  temperature+=(targetTemperature-temperature)*(1-Math.exp(-dt/inertia));
  keyboard.dataset.temperature=temperature.toFixed(2);
  keyboard.dataset.typingRate=inputRate.toFixed(2);
 }
 function registerStroke(){updateThermal(performance.now());inputRate=Math.min(12,inputRate+.5);}
 function emitInput(value,action){keyboard.dispatchEvent(new CustomEvent('keyboard-input',{bubbles:true,detail:{value,action,text:editor.value}}));}
 function virtualEdit(value,action){
  let start=editor.selectionStart,end=editor.selectionEnd;
  if(action==='delete'&&start===end&&start>0){
   const prefix=editor.value.slice(0,start);
   if(globalThis.Intl?.Segmenter){const segments=[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(prefix)];start=segments[segments.length-1].index;}
   else start-=Array.from(prefix).pop().length;
  }
  editor.setRangeText(value,start,end,'end');repeatInput=false;
  editor.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:action==='delete'?'deleteContentBackward':'insertText',data:value}));
  editor.focus({preventScroll:true});
 }
 const pointerPresses=new Map();
 function releasePointer(e){const button=pointerPresses.get(e.pointerId);if(button)button.classList.remove('is-pressed');pointerPresses.delete(e.pointerId);}
 root.addEventListener('pointerdown',e=>{
  const button=e.target.closest('.keyboard button');if(!button)return;
  if(document.activeElement===editor)e.preventDefault();
  if(button.matches('.key,.keyboard-round')){button.classList.add('is-pressed');pointerPresses.set(e.pointerId,button);}
 });
 window.addEventListener('pointerup',releasePointer);
 window.addEventListener('pointercancel',releasePointer);
 window.addEventListener('blur',()=>{pointerPresses.forEach(button=>button.classList.remove('is-pressed'));pointerPresses.clear();});
 editor.addEventListener('compositionstart',()=>{composing=true;});
 editor.addEventListener('compositionend',e=>{composing=false;lastComposition=performance.now();if(e.data)registerStroke();});
 editor.addEventListener('input',e=>{
  const type=e.inputType||'';
  if(!composing&&!e.isComposing&&!repeatInput&&performance.now()-lastComposition>60&&['insertText','insertLineBreak','insertParagraph'].includes(type)&&e.data!=='')registerStroke();
  const action=type.startsWith('delete')?'delete':'insert';emitInput(e.data||'',action);
 });
 editor.addEventListener('keydown',e=>{
  repeatInput=e.repeat;
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  const match=e.key==='Backspace'?root.querySelector('[data-action="delete"]'):e.key==='Enter'?root.querySelector('[data-action="enter"]'):[...root.querySelectorAll('.key[data-value]')].find(b=>b.dataset.value.toLowerCase()===e.key.toLowerCase());
  if(match)match.classList.add('is-pressed');
 });
 editor.addEventListener('keyup',()=>{repeatInput=false;root.querySelectorAll('.is-pressed').forEach(b=>b.classList.remove('is-pressed'));});
 editor.addEventListener('blur',()=>{repeatInput=false;root.querySelectorAll('.is-pressed').forEach(b=>b.classList.remove('is-pressed'));});
 const sets={ru:['йцукенгшщзх','фывапролджэ','ячсмитьбю'],en:['qwertyuiop','asdfghjkl','zxcvbnm'],num:['1234567890','@#₽%&*()-+','!?/;:«»=_']};
 function populate(){
  const set=numbers?sets.num:english?sets.en:sets.ru;
  const letter=(char)=>{const b=document.createElement('button');b.className='key cursor-interaction';b.type='button';b.dataset.value=char;b.textContent=uppercase?char.toUpperCase():char;return b;};
  rows.forEach((row,i)=>{row.replaceChildren(...[...set[i]].map(letter));row.style.gridTemplateColumns='repeat('+set[i].length+',minmax(0,1fr))';});
  const third=root.querySelector('.keyboard-row-third');third.querySelectorAll('[data-value]').forEach(b=>b.remove());
  const end=third.lastElementChild;[...set[2]].forEach(c=>third.insertBefore(letter(c),end));
  third.style.gridTemplateColumns='minmax(0,35.727fr) repeat('+set[2].length+',minmax(0,26.694fr)) minmax(0,36.027fr)';
  root.querySelector('.keyboard-language span').textContent=english?'English':'Русский';
  for(const button of root.querySelectorAll('.key,.keyboard-round')){
   if(button.querySelector('.key-content'))continue;
   const content=document.createElement('span');content.className='key-content';
   while(button.firstChild)content.appendChild(button.firstChild);
   if(!button.classList.contains('key-light')){button.append(content);continue;}
   const surface=document.createElement('span');surface.className='key-surface';surface.setAttribute('aria-hidden','true');
   const effect=document.createElement('span');effect.className='key-effects';effect.setAttribute('aria-hidden','true');
   const burn=document.createElement('span');burn.className='key-burn';burn.setAttribute('aria-hidden','true');
   button.append(surface,burn,effect,content);
  }
 }
 populate();
 root.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  const action=button.dataset.action;
  if(action==='shift'){uppercase=!uppercase;button.setAttribute('aria-pressed',String(uppercase));populate();return;}
  if(action==='language'){english=!english;populate();return;}
  if(action==='numbers'){numbers=!numbers;button.setAttribute('aria-pressed',String(numbers));populate();return;}
  let value=button.dataset.value;
  if(button.parentElement.classList.contains('keyboard-suggestions'))value=button.textContent+' ';
  if(action==='enter')value='\n';
  if(action==='delete')virtualEdit('','delete');
  else if(value!==undefined)virtualEdit(uppercase&&value.length===1?value.toUpperCase():value,'insert');
  else return;
  root.querySelector('[data-feedback]').textContent=action==='delete'?'Удалено':value===' '?'Пробел':value;
 });
 const reduced=matchMedia('(prefers-reduced-motion: reduce)');
 let elapsed=0,last=0,lastPaint=-100,visible=true;
 function prepareBackground(){
  if(!context)return;
  const source=document.createElement('canvas');source.width=clouds.width;source.height=clouds.height;
  const ctx=source.getContext('2d');ctx.fillStyle='#da6600';ctx.fillRect(0,0,source.width,source.height);
  ctx.drawImage(background,0,0,source.width,source.height);
  backgroundPixels=ctx.getImageData(0,0,source.width,source.height).data;
  paint(elapsed);
 }
 function paint(seconds){
  const hue=temperature<=24?(temperature-24)*4.5:(temperature-24)*1.35;
  const warmth=Math.max(0,Math.min(1,(temperature-24)/21));
  // Compress the hottest hues into orange, keeping the original lights and shadows.
  const palette='hue-rotate('+hue.toFixed(2)+'deg) sepia('+warmth.toFixed(3)+') saturate('+(1+1.5*warmth).toFixed(3)+') hue-rotate('+(-15*warmth).toFixed(2)+'deg)';
  clouds.style.filter=backgroundLayer.style.filter=palette;
  if(!context||!image||!backgroundPixels)return;
  const data=image.data,w=clouds.width,h=clouds.height,source=backgroundPixels;
  const flowX=Math.sin(seconds*.22),flowY=Math.sin(seconds*.17);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
   const u=x/w,v=y/h,edge=Math.pow(Math.sin(Math.PI*u)*Math.sin(Math.PI*v),2),weight=edge*Math.min(1,v*2);
   const sx=Math.max(0,Math.min(w-1.001,x+flowX*Math.sin(v*5.5+seconds*.09)*12*weight));
   const sy=Math.max(0,Math.min(h-1.001,y+flowY*Math.sin(u*5.2+seconds*.11)*16*weight));
   const ix=Math.floor(sx),iy=Math.floor(sy),fx=sx-ix,fy=sy-iy,k=(iy*w+ix)*4,i=(y*w+x)*4;
   for(let c=0;c<3;c++){const a=source[k+c]*(1-fx)+source[k+4+c]*fx,b=source[k+w*4+c]*(1-fx)+source[k+w*4+4+c]*fx;data[i+c]=a*(1-fy)+b*fy;}data[i+3]=255;
  }
  context.putImageData(image,0,0);
 }
 function tick(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(!document.hidden&&visible){updateThermal(now);if(!reduced.matches)elapsed+=dt;if(now-lastPaint>=40){paint(elapsed);lastPaint=now;}}requestAnimationFrame(tick);}
 new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;}).observe(keyboard);
 new ResizeObserver(()=>paint(elapsed)).observe(keyboard);
 if(background.complete&&background.naturalWidth)prepareBackground();else background.addEventListener('load',prepareBackground,{once:true});
 updateThermal(performance.now());paint(0);requestAnimationFrame(tick);
})();
</script>
